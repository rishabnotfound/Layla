x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  web:
    build: .
    env_file: .env
    restart: unless-stopped
    <<: *logging
  queue:
    build: .
    command: ["npm","run","queue"]
    env_file: .env
    restart: unless-stopped
    <<: *logging
  caddy:
    image: caddy:2-alpine
    ports: ["80:80","443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped
    <<: *logging
  prune:
    image: docker:cli
    entrypoint: ["sh","-c","while true; do docker image prune -af --filter 'until=168h'; sleep 86400; done"]
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    restart: unless-stopped
    <<: *logging
volumes:
  caddy_data:
  caddy_config:
